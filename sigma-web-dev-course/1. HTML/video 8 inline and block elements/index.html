<!--inline elements take small amount of space, and block elements take large amount of space-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and block elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Hey i am a para</p><!--block element-->
    <a href="http://google.com">Google</a><!--inline element-->
    <div>I am a block element</div><!--block element-->
    <span> I am span and i am inline</span><!--inline element-->
    <a href="">Yes it is inline</a>"<!--inline element-->
    <!--block element will take whole line  but inline element only 
    take the space that is required and also give chance to others in
    same line-->
    <!-- but it is not fixed that which element is inline or block
     as the display properties can be changed by css -->
</body>
</html>
