<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <video src="WIN_20260108_12_25_53_Pro.mp4" height="200" width="300" 
    controls loop poster="image.png"></video>
    <!--attributes- src, height, width, autoplay,
     controls(adds play, pause ,volume etc.),loop(plays again and again), 
     muted(no sound by default)-->
     <!--we can thumbnail as well-- poster attribute-->
     <audio src="Recording.m4a" controls loop preload="none"></audio>
     <!--attributes- src, autoplay, controls, loop, muted, -->
     <!--there is preload attribute which has attributes as none, metadata, auto-->
     <!--none means that the audio will not be loaded as long as the user press play-->
     <!--metadata and auto loads metadata and full data before pressing play respectively-->
    <!-- there is also a media file .svg where we can generate high quality 
     images-->
     <svg height="100" width="100">
    <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg><!--inline elements-->
    <img src="image.svg" alt="Sample SVG">
    <!--svg file was created by me as any html, css document is created-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/X8BYu3dMKf0?si=cftmv9JX1unvYgh1&amp;start=120" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!--this link is generated by youtube after clicking share>embed-->
     <iframe src="https://maps.google.com/maps?q=LOCATION&output=embed" 
     frameborder="0" title="web dev"></iframe>
     <iframe src="https://www.codewithharry.com" allowfullscreen title="web dev"></iframe>
</body>
</html>
