<!DOCTYPE html><!--main tag-->
<html lang="en"><!--html opening tag--><!--lang is an attribute-->
<head><!--basic structure (head,body) opening tag--><!--it comprises of meta tags-->
    <meta charset="UTF-8"><!--meta tags give basic info about page-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website </title><!--title appears in the tab button in top- used by search engines-->
    <link rel="stylesheet" href="style.css"><!--link css with html-->
</head><!--basic structure (head,body) closing tag-->
<body><!--basic structure (head,body) opening tag--><!--main content-->
    Hey This is my first website. This course is good.
    <script src="script.js"></script><!--link js with html-->
</body><!--basic structure (head,body) closing tag-->
</html><!--html closing tag-->
<!--attributes- charset, name, rel, src, href, content-->
