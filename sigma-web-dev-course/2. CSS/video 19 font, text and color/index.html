<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font</title>
    <style>
        @import url("https://fonts.google.com/?preview.text=hi%20hello&query=baloo+bhai");
        h1{
            font-style:italic;/*for italics*/
            font-weight:600;/*for bold*/
            font-family:Arial, Helvetica, sans-serif; /*for font - on the 
            basis of priority-if one is not available other is chosen*/
            font-size: 50px ;
            /* we can add pixels as well as large/small/ x-large */
            color: red;
            line-height:1.5;
            /* usually 1.1 and 1.2 */
            /* letter-spacing: 50px; not used much */
            text-transform:capitalize;
            /* other options -uppercase , lowercase etc. */
            text-decoration:underline;
            text-decoration-color:aqua;
            text-decoration-style:dotted;
            text-decoration-thickness:10px;
            text-indent:80px;/*indent means space between left margin and text*/
            text-overflow:ellipsis;
            width:80px;
            margin:4px;
            border:solid black 2px;
            overflow:hidden;
            /*it means if text is getting outside border then 
            overflown text will be hidden by ...*/ 
            word-break: break-all;
            /*it means it will break the words to fit inside border*/
            text-align: center;

        }
        

    </style>
</head>
<body>
    <h1>Hello, it is font related task </h1>
    
</body>
</html>
