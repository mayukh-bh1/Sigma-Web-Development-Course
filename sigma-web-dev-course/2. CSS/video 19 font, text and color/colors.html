<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        h1{
            color:red;
            
        }


    </style>
</head>
<body>
    <h1>Hello hi there i am using whatsapp</h1>
    <p> Colors can be represented as (most used) :
        <ol>
            <li style="color:red">Color keywords</li>
            <li style="color:#c12121">Hex color codes</li><!--most popular-->
            <li style="color:rgb(184, 28, 28)">RGB</li>
            <li style="color:rgba(134, 42, 42, 0.67)">RGBA</li><!--same as rgb just 
            the last one is called alpha. it has a value from 0 to 1, the color column
            near the pallette. it adjusts the shade-->
            <li style="color:hsl(0, 79%, 44%)">HSL</li><!--hsl- hue,saturation,lightness-->
        </ol>

    </p>
</body>
</html>
