<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css display properties</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        .box{
            
            border: 2px solid black;
            display:inline-block;
            width:344px;
            margin:4px;
            padding:10px;
        
        }
        .box1{
            display:none;
            /*space and text will be gone*/
            /* visibility: hidden; */
            /*text won't be there, but space 
            will be there */

        }
        span{
            border: 2px solid black;
            padding:10px;
            display:flex;
            justify-content: center;
            
        }

    </style>
</head>
<body>
    <!--in one previous video, 
    we got to know we have inline elements and block elements and by 
    default some elements are block and inline element  
    but we can change that too. in css. we can change their display 
    properties
    1)inline
    2)block
    3)inline-block
    4)none
    5)flex
    -->
    <div class="box box1">
        Hello
    </div>
    <div class="box">
        Hello
    </div>
    <span>Hello</span>
    

</body>
</html>
