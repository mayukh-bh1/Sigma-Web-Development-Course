<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
            margin-top: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        #taskInput {
            width: 70%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
        }

        #addBtn {
            width: 25%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        #addBtn:hover {
            background-color: #45a049;
        }

        .filter-section {
            margin-bottom: 15px;
            text-align: center;
        }

        .filter-btn {
            padding: 8px 15px;
            margin: 0 5px;
            background-color: #e0e0e0;
            border: none;
            cursor: pointer;
        }

        .filter-btn.active {
            background-color: #666;
            color: white;
        }

        .task-list {
            list-style: none;
            padding: 0;
        }

        .task-item {
            background: #fafafa;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 3px solid #4CAF50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-item.completed {
            border-left-color: #999;
            background: #f0f0f0;
        }

        .task-text {
            flex: 1;
            padding-right: 10px;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #999;
        }

        .task-buttons button {
            padding: 6px 12px;
            margin-left: 5px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        .complete-btn {
            background-color: #2196F3;
            color: white;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Task Manager</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn" onclick="addTask()">Add Task</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" onclick="filterTasks('all')">All</button>
            <button class="filter-btn" onclick="filterTasks('active')">Active</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
        </div>

        <ul class="task-list" id="taskList">
            <div class="empty-message">No tasks yet. Add one above!</div>
        </ul>

        <div class="stats" id="stats">
            Total: 0 | Active: 0 | Completed: 0
        </div>
    </div>

    <script>
        var tasks = [];
        var currentFilter = 'all';

        function addTask() {
            var input = document.getElementById('taskInput');
            var taskText = input.value.trim();
            
            if (taskText === '') {
                alert('Please enter a task!');
                return;
            }

            var task = {
                id: Date.now(),
                text: taskText,
                completed: false
            };

            tasks.push(task);
            input.value = '';
            renderTasks();
        }

        function toggleComplete(id) {
            var task = tasks.find(function(t) { return t.id === id; });
            if (task) {
                task.completed = !task.completed;
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(function(t) { return t.id !== id; });
            renderTasks();
        }

        function filterTasks(filter) {
            currentFilter = filter;
            
            var buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTasks();
        }

        function renderTasks() {
            var taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            var filteredTasks = tasks.filter(function(task) {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            if (filteredTasks.length === 0) {
                taskList.innerHTML = '<div class="empty-message">No tasks to show!</div>';
            } else {
                filteredTasks.forEach(function(task) {
                    var li = document.createElement('li');
                    li.className = 'task-item' + (task.completed ? ' completed' : '');
                    
                    li.innerHTML = 
                        '<span class="task-text' + (task.completed ? ' completed' : '') + '">' + 
                        task.text + 
                        '</span>' +
                        '<div class="task-buttons">' +
                        '<button class="complete-btn" onclick="toggleComplete(' + task.id + ')">' +
                        (task.completed ? 'Undo' : 'Complete') +
                        '</button>' +
                        '<button class="delete-btn" onclick="deleteTask(' + task.id + ')">Delete</button>' +
                        '</div>';
                    
                    taskList.appendChild(li);
                });
            }

            updateStats();
        }

        function updateStats() {
            var total = tasks.length;
            var completed = tasks.filter(function(t) { return t.completed; }).length;
            var active = total - completed;
            
            document.getElementById('stats').textContent = 
                'Total: ' + total + ' | Active: ' + active + ' | Completed: ' + completed;
        }

        // Allow Enter key to add task
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>

</body>
</html>
