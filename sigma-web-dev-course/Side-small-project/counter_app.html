<!DOCTYPE html>
<html lang="en">
<head>
    <title>Counter</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        #counter {
            font-size: 60px;
            text-align: center;
            margin: 30px 0;
            
        }

     

        .buttons {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #999;
            background-color: #e0e0e0;
        }

        button:hover {
            background-color: #d0d0d0;
        }
 
    </style>
</head>
<body>

    <div class="container">
        <h1>Counter App</h1>
        <p>Use buttons to change the value</p>
        
        <div id="counter">0</div>
        
        <div class="buttons">
            <button onclick="decreaseCount()">Decrease</button>
            <button onclick="resetCount()">Reset</button>
            <button onclick="increaseCount()">Increase</button>
        </div>

        
    </div>

    <script>
        let count = 0;

        function increaseCount() {
            count = count + 1;
            updateCounter();
        
        }

        function decreaseCount() {
            count = count - 1;
            updateCounter();
            
        }

        function resetCount() {
            count = 0;
            updateCounter();
            
        }

        function updateCounter() {
            let display = document.getElementById("counter");
            display.textContent = count;
            

        }

    
    </script>

</body>
</html>
