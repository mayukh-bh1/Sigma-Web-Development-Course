<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">My Notes App</h1>

        <!-- Add Note Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Create New Note</h2>
            <input 
                type="text" 
                id="noteTitle" 
                placeholder="Note Title" 
                class="w-full p-3 border border-gray-300 rounded mb-3 focus:outline-none focus:border-blue-500"
            >
            <textarea 
                id="noteContent" 
                placeholder="Note Content" 
                rows="4" 
                class="w-full p-3 border border-gray-300 rounded mb-3 focus:outline-none focus:border-blue-500"
            ></textarea>
            <button 
                onclick="addNote()" 
                class="w-full bg-blue-500 text-white py-3 rounded hover:bg-blue-600 font-semibold"
            >
                Add Note
            </button>
        </div>

        <!-- Notes List -->
        <div id="notesList" class="space-y-4">
            <p class="text-center text-gray-500">Loading notes...</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full mx-4">
            <h2 class="text-xl font-semibold mb-4">Edit Note</h2>
            <input 
                type="text" 
                id="editTitle" 
                class="w-full p-3 border border-gray-300 rounded mb-3"
            >
            <textarea 
                id="editContent" 
                rows="4" 
                class="w-full p-3 border border-gray-300 rounded mb-3"
            ></textarea>
            <div class="flex gap-2">
                <button 
                    onclick="saveEdit()" 
                    class="flex-1 bg-green-500 text-white py-2 rounded hover:bg-green-600"
                >
                    Save
                </button>
                <button 
                    onclick="closeModal()" 
                    class="flex-1 bg-gray-500 text-white py-2 rounded hover:bg-gray-600"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentEditId = null;

        // Load notes when page loads
        loadNotes();

        async function loadNotes() {
            try {
                const response = await fetch('/api/notes');
                const notes = await response.json();
                displayNotes(notes);
            } catch (error) {
                console.error('Error loading notes:', error);
                document.getElementById('notesList').innerHTML = 
                    '<p class="text-center text-red-500">Error loading notes</p>';
            }
        }

        function displayNotes(notes) {
            const notesList = document.getElementById('notesList');
            
            if (notes.length === 0) {
                notesList.innerHTML = '<p class="text-center text-gray-500">No notes yet. Create one above!</p>';
                return;
            }

            notesList.innerHTML = notes.map(note => `
                <div class="bg-white p-5 rounded-lg shadow-md">
                    <h3 class="text-lg font-bold mb-2 text-gray-800">${note.title}</h3>
                    <p class="text-gray-600 mb-3">${note.content}</p>
                    <div class="flex gap-2 text-sm text-gray-500">
                        <span>${new Date(note.createdAt).toLocaleDateString()}</span>
                        <span class="flex-1"></span>
                        <button 
                            onclick="editNote('${note._id}', '${escapeHtml(note.title)}', '${escapeHtml(note.content)}')" 
                            class="text-blue-500 hover:text-blue-700"
                        >
                            Edit
                        </button>
                        <button 
                            onclick="deleteNote('${note._id}')" 
                            class="text-red-500 hover:text-red-700"
                        >
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();

            if (!title || !content) {
                alert('Please fill in both title and content');
                return;
            }

            try {
                const response = await fetch('/api/notes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    document.getElementById('noteTitle').value = '';
                    document.getElementById('noteContent').value = '';
                    loadNotes();
                }
            } catch (error) {
                console.error('Error adding note:', error);
                alert('Error adding note');
            }
        }

        function editNote(id, title, content) {
            currentEditId = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editContent').value = content;
            document.getElementById('editModal').classList.remove('hidden');
        }

        async function saveEdit() {
            const title = document.getElementById('editTitle').value.trim();
            const content = document.getElementById('editContent').value.trim();

            if (!title || !content) {
                alert('Please fill in both title and content');
                return;
            }

            try {
                const response = await fetch(`/api/notes/${currentEditId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    closeModal();
                    loadNotes();
                }
            } catch (error) {
                console.error('Error updating note:', error);
                alert('Error updating note');
            }
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
            currentEditId = null;
        }

        async function deleteNote(id) {
            if (!confirm('Are you sure you want to delete this note?')) {
                return;
            }

            try {
                const response = await fetch(`/api/notes/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadNotes();
                }
            } catch (error) {
                console.error('Error deleting note:', error);
                alert('Error deleting note');
            }
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>

</body>
</html>
